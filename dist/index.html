<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EF7F1A">
  <meta name="description" content="A short survey on how you pay with UPI on iMobile.">
  <meta property="og:title" content="UPI Scan & Pay feedback · iMobile">
  <meta property="og:description" content="A short survey on how you pay with UPI on iMobile.">
  <meta property="og:type" content="website">
  <title>UPI Scan & Pay feedback · iMobile</title>
  <link rel="stylesheet" href="base.css">
  <script src="config.js"></script>
  <script src="rules.js"></script>
  <script src="questions.js"></script>
  <link rel="icon" href="data:,">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="survey-header" role="banner" aria-label="ICICI Bank — UPI Scan &amp; Pay feedback">
    <div class="survey-header-inner">
      <img
        class="survey-header-logo"
        src="assets/icici-logo.svg"
        alt="ICICI Bank"
        width="175"
        height="34"
        decoding="async">
      <p class="survey-header-title">UPI Scan &amp; Pay feedback</p>
    </div>
  </header>
  <main id="main">
    <div class="progress-row">
      <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
      <span id="step-label" aria-label="Survey progress">1 / 8</span>
    </div>
    <form id="survey" novalidate>
      <div id="screen"><p>Loading survey…</p></div>
      <p id="form-error" class="error" role="alert" hidden></p>
      <div class="action-dock"><p id="next-hint" class="next-hint" hidden>Choose an answer to continue.</p><div class="action-inner"><button id="back" type="button" class="back" hidden>← Back</button><button id="next" type="submit" class="send" disabled>Next</button></div></div>
    </form>
    <noscript><p>Please enable JavaScript to complete the survey.</p></noscript>
  </main>
</body>
</html>
